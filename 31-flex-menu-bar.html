
<!DOCTYPE html>
<html>
<head>
    <title>Flex Menu Bar</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            background-color: blue;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar a:hover {
            color: yellow;
        }
    </style>
</head>

<body>

    <div class="navbar">

        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>

    </div>

</body>
</html>
