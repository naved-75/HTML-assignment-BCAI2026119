
<!DOCTYPE html>
<html>
<head>
    <title>Grid and Flex Landing Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        /* Navbar using Flexbox */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: blue;
            color: white;
            padding: 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        /* Main Section using Grid */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }

            .navbar {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <div class="container">

        <div class="box">
            <h1>Welcome</h1>
            <p>This is my landing page.</p>
            <button>Get Started</button>
        </div>

        <div class="box">
            <h2>About Us</h2>
            <p>We create beautiful websites using HTML and CSS.</p>
        </div>

    </div>

</body>
</html>
