
<!DOCTYPE html>
<html>
<head>
    <title>Card Variants</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background-color: white;
            width: 200px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
        }

        .card h2 {
            color: blue;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Card Variants</h1>

    <div class="container">

        <div class="card">
            <h2>Card 1</h2>
            <p>This is a simple card.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is another card.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is a beautiful card.</p>
            <button>Read More</button>
        </div>

    </div>

</body>
</html>
