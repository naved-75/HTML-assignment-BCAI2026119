
<!DOCTYPE html>
<html>
<head>
    <title>Landing Skeleton Desktop</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .header {
            background-color: blue;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            background-color: lightblue;
            text-align: center;
            padding: 80px;
        }

        .hero button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .box {
            background-color: lightgray;
            padding: 30px;
            text-align: center;
        }

        .footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <div class="hero">
        <h1>Welcome to My Website</h1>
        <p>Build your website with HTML and CSS.</p>
        <button>Get Started</button>
    </div>

    <div class="content">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of Website</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Design of Website</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>Website Functionality</p>
        </div>

    </div>

    <div class="footer">
        <p>Copyright 2026 My Website</p>
    </div>

</body>
</html>
