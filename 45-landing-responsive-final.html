
<!DOCTYPE html>
<html>
<head>
    <title>Landing Responsive Final</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        /* Navbar */
        .navbar {
            background-color: blue;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        /* Hero Section */
        .hero {
            background-color: lightblue;
            text-align: center;
            padding: 60px 20px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 12px 25px;
            border: none;
        }

        /* Content */
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .box {
            background-color: lightgray;
            padding: 30px;
            text-align: center;
        }

        /* Footer */
        .footer {
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .navbar {
                flex-direction: column;
            }

            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <div class="hero">
        <h1>Welcome to My Website</h1>
        <p>Create a beautiful responsive website.</p>
        <button>Get Started</button>
    </div>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>HTML creates website structure.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>CSS makes websites beautiful.</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>JavaScript adds functionality.</p>
        </div>

    </div>

    <div class="footer">
        <p>Copyright 2026 My Website</p>
    </div>

</body>
</html>
