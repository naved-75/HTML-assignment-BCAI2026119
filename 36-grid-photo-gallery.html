
<!DOCTYPE html>
<html>
<head>
    <title>Grid Photo Gallery</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">
        <img src="image1.jpg" alt="Photo 1">
        <img src="image2.jpg" alt="Photo 2">
        <img src="image3.jpg" alt="Photo 3">
        <img src="image4.jpg" alt="Photo 4">
        <img src="image5.jpg" alt="Photo 5">
        <img src="image6.jpg" alt="Photo 6">
    </div>

</body>
</html>
