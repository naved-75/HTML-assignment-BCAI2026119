
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Audit Fix</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .header {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .box {
            background-color: lightblue;
            padding: 30px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>My Website</h1>
    </div>

    <div class="container">

        <div class="box">
            <h2>Box 1</h2>
            <p>Welcome to my website.</p>
        </div>

        <div class="box">
            <h2>Box 2</h2>
            <p>This is responsive design.</p>
        </div>

        <div class="box">
            <h2>Box 3</h2>
            <p>Mobile friendly website.</p>
        </div>

    </div>

</body>
</html>
