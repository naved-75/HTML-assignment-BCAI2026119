
<!DOCTYPE html>
<html>
<head>
    <title>Fix Overflow</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
        }

        .box {
            width: 300px;
            height: 150px;
            background-color: lightblue;
            border: 2px solid blue;
            padding: 10px;
            overflow: auto;
            margin: 50px auto;
        }

        h2 {
            text-align: center;
            color: blue;
        }
    </style>
</head>

<body>

    <h2>Fix Overflow Example</h2>

    <div class="box">
        CSS Overflow property controls what happens
        when content is too large to fit inside an element.

        This is an example of overflow auto.
        When content exceeds the box size,
        a scrollbar appears automatically.
    </div>

</body>
</html>
