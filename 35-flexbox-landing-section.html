
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Landing Section</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: lightgray;
        }

        .navbar {
            background-color: darkblue;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 50px;
        }

        .content {
            width: 300px;
        }

        .content h1 {
            color: darkblue;
        }

        .content button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }

        .image {
            width: 300px;
            height: 200px;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <div class="container">

        <div class="content">
            <h1>Welcome to Our Website</h1>

            <p>
                Learn HTML and CSS with simple examples.
                Start your web development journey today.
            </p>

            <button>Get Started</button>
        </div>

        <div class="image">
            <h2>Image Section</h2>
        </div>

    </div>

</body>
</html>
