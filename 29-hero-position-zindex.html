
<!DOCTYPE html>
<html>
<head>
    <title>Hero Position Z-Index</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
        }

        .hero {
            position: relative;
            width: 500px;
            height: 300px;
            background-color: lightblue;
            margin: 50px auto;
        }

        .box1 {
            position: absolute;
            background-color: blue;
            color: white;
            width: 200px;
            padding: 30px;
            top: 40px;
            left: 50px;
            z-index: 1;
        }

        .box2 {
            position: absolute;
            background-color: orange;
            color: white;
            width: 200px;
            padding: 30px;
            top: 100px;
            left: 120px;
            z-index: 2;
        }

    </style>
</head>

<body>

    <h1>Position and Z-Index</h1>

    <div class="hero">

        <div class="box1">
            Box 1
        </div>

        <div class="box2">
            Box 2
        </div>

    </div>

</body>
</html>
