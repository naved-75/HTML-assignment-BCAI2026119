
<!DOCTYPE html>
<html>
<head>
    <title>Flex Navbar Hero</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .navbar {
            background-color: blue;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .navbar h2 {
            color: white;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        .hero {
            background-color: lightblue;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
            color: darkblue;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h2>My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>

    <div class="hero">
        <div>
            <h1>Welcome to My Website</h1>
            <p>Learn HTML and CSS Easily</p>
            <button>Get Started</button>
        </div>
    </div>

</body>
</html>
