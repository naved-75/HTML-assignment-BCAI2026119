
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: blue;
        }

        .margin {
            background-color: orange;
            padding: 20px;
            width: 350px;
            margin: 30px auto;
        }

        .border {
            background-color: yellow;
            padding: 20px;
            border: 5px solid black;
        }

        .padding {
            background-color: lightgreen;
            padding: 20px;
        }

        .content {
            background-color: lightblue;
            padding: 20px;
        }

        p {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <p>CSS Box Model Example</p>

    <div class="margin">
        MARGIN

        <div class="border">
            BORDER

            <div class="padding">
                PADDING

                <div class="content">
                    CONTENT
                </div>

            </div>
        </div>
    </div>

</body>
</html>
