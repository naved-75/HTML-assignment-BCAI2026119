
<!DOCTYPE html>
<html>
<head>
    <title>Profile Product Card</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
        }

        .card {
            width: 250px;
            background-color: white;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        h2 {
            color: blue;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://via.placeholder.com/100" alt="Profile">

        <h2>John Doe</h2>

        <p>Web Developer</p>

        <p>Welcome to my profile card.</p>

        <button>View Profile</button>

    </div>

</body>
</html>
