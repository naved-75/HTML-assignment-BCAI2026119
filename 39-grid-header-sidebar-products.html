
<!DOCTYPE html>
<html>
<head>
    <title>Grid Header Sidebar Products</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px auto;
            gap: 10px;
        }

        .header {
            grid-column: 1 / 3;
            background-color: blue;
            color: white;
            padding: 20px;
        }

        .sidebar {
            background-color: lightgray;
            padding: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .card {
            background-color: lightblue;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h2>My Website</h2>
        </div>

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>Home</p>
            <p>Products</p>
            <p>Contact</p>
        </div>

        <div class="products">

            <div class="card">
                <h3>Product 1</h3>
                <p>Price: ₹500</p>
            </div>

            <div class="card">
                <h3>Product 2</h3>
                <p>Price: ₹700</p>
            </div>

            <div class="card">
                <h3>Product 3</h3>
                <p>Price: ₹900</p>
            </div>

        </div>

    </div>

</body>
</html>
